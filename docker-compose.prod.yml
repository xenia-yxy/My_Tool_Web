services:
  my-web:
    image: my-web:${IMAGE_TAG}
    container_name: my-web
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - /opt/my-web/runtime:/app/.runtime
    restart: unless-stopped

  my-web-worker:
    image: my-web:${IMAGE_TAG}
    container_name: my-web-worker
    env_file:
      - .env.production
    command:
      - sh
      - -c
      - |
        while true; do
          wget -qO- --header="x-internal-worker-token: $${AUTH_SECRET:-$${NEXTAUTH_SECRET}}" --post-data="" http://my-web:3000/api/internal/ai-image-worker || true
          sleep 2
        done
    volumes:
      - /opt/my-web/runtime:/app/.runtime
    depends_on:
      - my-web
    restart: unless-stopped
