services:
  my-web-postgres:
    image: postgres:16-alpine
    container_name: my-web-postgres
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: my_web
      POSTGRES_USER: my_web
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_web -d my_web"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - my-web-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  my-web:
    image: my-web:${IMAGE_TAG}
    container_name: my-web
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - /opt/my-web/runtime:/app/.runtime
    depends_on:
      my-web-postgres:
        condition: service_healthy
    restart: unless-stopped

  my-web-worker:
    image: my-web:${IMAGE_TAG}
    container_name: my-web-worker
    env_file:
      - .env.production
    command:
      - sh
      - -c
      - |
        while true; do
          wget -qO- --header="x-internal-worker-token: $${AUTH_SECRET:-$${NEXTAUTH_SECRET}}" --post-data="" http://my-web:3000/api/internal/ai-image-worker || true
          sleep 2
        done
    volumes:
      - /opt/my-web/runtime:/app/.runtime
    depends_on:
      my-web:
        condition: service_started
      my-web-postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  my-web-postgres-data:
