services:
  my-web:
    image: my-web:${IMAGE_TAG}
    container_name: my-web
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - /opt/my-web/runtime:/app/.runtime
    restart: unless-stopped
